<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA Global</title>
<meta name="description" content="LA Global LLC - strategy and advisory for media and technology.">
<link rel="canonical" href="https://laglobal.io/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="LA Global">
<meta property="og:title" content="LA Global">
<meta property="og:description" content="LA Global LLC - strategy and advisory for media and technology.">
<meta property="og:url" content="https://laglobal.io/">
<meta property="og:image" content="https://laglobal.io/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="LA Global">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="LA Global">
<meta name="twitter:description" content="LA Global LLC - strategy and advisory for media and technology.">
<meta name="twitter:image" content="https://laglobal.io/og-image.png">
<meta name="theme-color" content="#0A0C12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root{
    --ink:#0A0C12;
    --blue:#3552FF;
    --amber:#FF9D42;
    --amber-lt:#FFB673;
    --fog:#F5F6F9;
    --line:#E2E5EB;
    --body-gray:#646B7A;
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    --mono:'DM Mono',ui-monospace,monospace;
  }

  html,body{height:100%}
  body{font-family:var(--sans);font-size:16px;line-height:1.6;color:#fff;
    background:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  body.locked{overflow:hidden}

  /* ══ STAGE ══ */
  .stage{position:relative;height:100%;min-height:100dvh;display:flex;
    flex-direction:column;align-items:center;justify-content:center;
    padding:40px 6vw;overflow:hidden}
  #net{position:absolute;inset:0;width:100%;height:100%;display:block}
  .veil{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 58% 58% at 50% 48%,rgba(10,12,18,.93) 0%,rgba(10,12,18,.55) 46%,rgba(10,12,18,0) 80%)}
  .inner{position:relative;z-index:3;display:flex;flex-direction:column;
    align-items:center;text-align:center}

  /* ══ LOGO ══ */
  .mark{width:72px;height:72px;overflow:visible;margin-bottom:22px}
  .mark-ring{fill:none;stroke:#fff;stroke-width:2.7;stroke-dasharray:135.1;stroke-dashoffset:135.1;
    animation:ringDraw 1.3s .15s cubic-bezier(.65,0,.35,1) forwards}
  .mark-chev{fill:none;stroke:var(--blue);stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:47;stroke-dashoffset:47;animation:chevDraw .75s .85s cubic-bezier(.65,0,.35,1) forwards}
  .mark-dot{fill:var(--amber);opacity:0;transform-origin:62.2px 55.2px;
    animation:dotIn .45s 1.5s cubic-bezier(.34,1.56,.64,1) forwards}
  @keyframes ringDraw{to{stroke-dashoffset:0}}
  @keyframes chevDraw{to{stroke-dashoffset:0}}
  @keyframes dotIn{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}

  .wordmark-text{display:flex;align-items:baseline;gap:7px;font-size:17px;line-height:1;
    opacity:0;animation:fadeUp .8s 1.5s ease forwards}
  .wordmark-text .la{color:#fff;font-size:1em;font-weight:600;letter-spacing:.2em}
  .wordmark-text .global{color:rgba(255,255,255,.74);font-size:1em;font-weight:300;
    letter-spacing:.2em;margin-right:-.2em}

  .tagline{font-family:var(--mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;
    color:rgba(255,255,255,.52);margin-top:20px;opacity:0;
    animation:fadeUp .8s 1.75s ease forwards}

  .btn-amber{background:var(--amber);color:var(--ink);padding:15px 34px;font-size:11px;
    letter-spacing:.15em;text-transform:uppercase;font-weight:600;border-radius:3px;
    border:none;cursor:pointer;font-family:var(--sans);margin-top:40px;opacity:0;
    animation:fadeUp .8s 2s ease forwards;
    transition:background .2s,transform .15s}
  .btn-amber:hover{background:var(--amber-lt);transform:translateY(-2px)}

  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .foot{position:absolute;bottom:26px;left:0;right:0;z-index:3;text-align:center;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
    color:rgba(255,255,255,.38);opacity:0;animation:fadeUp .8s 2.3s ease forwards}
  .foot a{color:rgba(255,255,255,.52);text-decoration:none;transition:color .2s}
  .foot a:hover{color:var(--amber)}
  .foot span{margin:0 9px;color:rgba(255,255,255,.22)}

  /* ══ MODAL ══ */
  .modal{position:fixed;inset:0;z-index:300;display:flex;align-items:center;
    justify-content:center;padding:20px;opacity:0;visibility:hidden;
    transition:opacity .3s,visibility .3s}
  .modal.open{opacity:1;visibility:visible}
  .modal-scrim{position:absolute;inset:0;background:rgba(10,12,18,.8);backdrop-filter:blur(6px)}
  .modal-box{position:relative;background:#fff;color:var(--ink);border-radius:5px;width:100%;
    max-width:540px;max-height:90vh;overflow-y:auto;padding:42px 44px;
    transform:translateY(16px);transition:transform .35s cubic-bezier(.34,1.2,.64,1)}
  .modal.open .modal-box{transform:none}
  .modal-close{position:absolute;top:18px;right:18px;width:34px;height:34px;border:none;
    background:none;cursor:pointer;color:#8B92A2;font-size:22px;line-height:1;
    border-radius:3px;transition:color .2s,background .2s}
  .modal-close:hover{color:var(--ink);background:var(--fog)}
  .modal-box h2{font-size:25px;font-weight:500;line-height:1.2;margin-bottom:9px;
    letter-spacing:-.01em;color:var(--ink)}
  .modal-box>p{font-size:14px;color:var(--body-gray);line-height:1.6;
    margin-bottom:26px;font-weight:300}

  .field{margin-bottom:16px}
  .field label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--body-gray);margin-bottom:7px}
  .field input,.field select,.field textarea{width:100%;font-family:var(--sans);
    font-size:14.5px;color:var(--ink);background:#fff;border:1px solid var(--line);
    border-radius:3px;padding:12px 13px;transition:border-color .2s,box-shadow .2s}
  .field textarea{resize:vertical;min-height:92px;line-height:1.6}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;
    border-color:var(--blue);box-shadow:0 0 0 3px rgba(53,82,255,.12)}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

  .form-msg{font-size:13.5px;line-height:1.6;padding:13px 15px;border-radius:3px;
    margin-bottom:16px;display:none}
  .form-msg.show{display:block}
  .form-msg.ok{background:#F0F7EE;color:#2C5E2E;border:1px solid #C9E2C4}
  .form-msg.err{background:#FDF2EC;color:#8A4A16;border:1px solid #F2D3BC}

  .btn-ink{background:var(--ink);color:#fff;padding:15px 34px;font-size:11px;
    letter-spacing:.15em;text-transform:uppercase;font-weight:600;border-radius:3px;
    border:none;cursor:pointer;font-family:var(--sans);width:100%;margin-top:6px;
    transition:background .2s}
  .btn-ink:hover{background:#161C2B}
  .form-note{font-size:11.5px;color:#8B92A2;line-height:1.6;margin-top:14px}
  .form-note a{color:var(--blue)}

  :focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:2px}

  @media(prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;animation-iteration-count:1!important;
      transition-duration:.01ms!important}
    .mark-ring,.mark-chev{stroke-dashoffset:0}
    .mark-dot,.wordmark-text,.tagline,.btn-amber,.foot{opacity:1}
  }

  @media(max-width:560px){
    .mark{width:60px;height:60px}
    .modal-box{padding:34px 24px}
    .modal-box h2{font-size:22px}
    .field-row{grid-template-columns:1fr}
    .foot{bottom:18px;font-size:9px}
  }
</style>
</head>
<body>

<main class="stage">
  <canvas id="net"></canvas>
  <div class="veil"></div>

  <div class="inner">
    <svg class="mark" viewBox="0 0 100 100" role="img" aria-label="LA Global">
      <circle class="mark-ring" cx="50" cy="50" r="21.5"/>
      <path class="mark-chev" d="M37.8 55.2 L50 37.8 L62.2 55.2"/>
      <circle class="mark-dot" cx="62.2" cy="55.2" r="4.1"/>
    </svg>

    <div class="wordmark-text"><span class="la">LA</span><span class="global">GLOBAL</span></div>
    <div class="tagline">Strategy &amp; Advisory</div>

    <button class="btn-amber" type="button" id="openBtn" aria-haspopup="dialog">Get in Touch</button>
  </div>

  <div class="foot">
    <a href="mailto:contact@laglobal.io">contact@laglobal.io</a>
    <span>·</span>
    &copy; <span id="yr">2026</span> LA Global LLC
  </div>
</main>

<div class="modal" id="contactModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
  <div class="modal-scrim" data-close></div>
  <div class="modal-box">
    <button class="modal-close" type="button" data-close aria-label="Close">&times;</button>
    <h2 id="modalTitle">Get in touch</h2>
    <p>Tell us what you're working on. We reply to every message within two business days.</p>

    <div class="form-msg" id="formMsg" role="status"></div>

    <form id="contactForm" novalidate>
      <div class="field-row">
        <div class="field">
          <label for="cf-name">Name</label>
          <input type="text" id="cf-name" name="name" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="cf-company">Company</label>
          <input type="text" id="cf-company" name="company" autocomplete="organization">
        </div>
      </div>
      <div class="field">
        <label for="cf-email">Work email</label>
        <input type="email" id="cf-email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="cf-topic">What are you exploring?</label>
        <select id="cf-topic" name="topic">
          <option>Data Licensing &amp; Monetization</option>
          <option>AI Transformation &amp; Efficiency</option>
          <option>Agent Deployment</option>
          <option>O&amp;O Data Strategy</option>
          <option>Board &amp; C-Suite Advisory</option>
          <option>Something else</option>
        </select>
      </div>
      <div class="field">
        <label for="cf-message">Message</label>
        <textarea id="cf-message" name="message" required></textarea>
      </div>
      <div class="hp" aria-hidden="true">
        <label for="cf-site">Leave this empty</label>
        <input type="text" id="cf-site" name="site" tabindex="-1" autocomplete="off">
      </div>
      <button type="submit" class="btn-ink" id="cf-submit">Send Message</button>
      <p class="form-note">We never share your details.</p>
    </form>
  </div>
</div>

<script>
(function(){
  'use strict';

  var WEB3FORMS_KEY = 'c775bfcf-c57b-4fb1-a026-89f5aa2fe793';
  var CONTACT_EMAIL = 'contact@laglobal.io';

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.getElementById('yr').textContent = new Date().getFullYear();

  /* ═══ BACKGROUND ═══ */
  var cv = document.getElementById('net'), ctx = cv.getContext('2d');
  var W = 0, H = 0, nodes = [], streams = [], bars = [], t = 0;

  function size(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    if(!W || !H) return;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }

  function build(){
    var count = Math.max(26, Math.min(68, Math.round(W * H / 18000))), i;
    nodes = [];
    for(i = 0; i < count; i++) nodes.push({
      x: Math.random()*W, y: Math.random()*H,
      vx:(Math.random()-.5)*.22, vy:(Math.random()-.5)*.22,
      r: Math.random()*1.6+.9, hot: Math.random() < .18
    });
    streams = [];
    for(i = 0; i < 7; i++) streams.push({
      y:(H/8)*(i+.6)+(Math.random()-.5)*30,
      x: Math.random()*W, len: 70+Math.random()*130, sp:.5+Math.random()*1.1
    });
    var bw = 13, gap = 9, n = Math.ceil(W/(bw+gap)) + 1;
    bars = [];
    for(i = 0; i < n; i++) bars.push({
      x: i*(bw+gap), w: bw, base: 12+Math.random()*70,
      amp: 10+Math.random()*36, ph: Math.random()*Math.PI*2, sp:.006+Math.random()*.012
    });
  }

  function frame(){
    if(!W || !H) return;
    t++;
    ctx.clearRect(0,0,W,H);

    ctx.strokeStyle = 'rgba(53,82,255,0.06)'; ctx.lineWidth = 1;
    for(var x = 0; x < W; x += 92){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for(var y = 0; y < H; y += 92){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

    bars.forEach(function(b){
      var h = b.base + Math.sin(t*b.sp + b.ph) * b.amp;
      var g = ctx.createLinearGradient(0, H-h, 0, H);
      g.addColorStop(0,'rgba(53,82,255,0.22)');
      g.addColorStop(1,'rgba(53,82,255,0.01)');
      ctx.fillStyle = g; ctx.fillRect(b.x, H-h, b.w, h);
      ctx.fillStyle = 'rgba(107,130,255,0.45)'; ctx.fillRect(b.x, H-h, b.w, 1.4);
    });

    streams.forEach(function(s){
      s.x += s.sp;
      if(s.x - s.len > W) s.x = -s.len;
      var g = ctx.createLinearGradient(s.x-s.len, 0, s.x, 0);
      g.addColorStop(0,'rgba(255,157,66,0)');
      g.addColorStop(1,'rgba(255,157,66,0.5)');
      ctx.strokeStyle = g; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(s.x-s.len, s.y); ctx.lineTo(s.x, s.y); ctx.stroke();
      ctx.fillStyle = 'rgba(255,182,115,0.9)';
      ctx.beginPath(); ctx.arc(s.x, s.y, 1.8, 0, 6.283); ctx.fill();
    });

    for(var i = 0; i < nodes.length; i++){
      var a = nodes[i];
      a.x += a.vx; a.y += a.vy;
      if(a.x < 0 || a.x > W) a.vx *= -1;
      if(a.y < 0 || a.y > H) a.vy *= -1;
      for(var j = i+1; j < nodes.length; j++){
        var b2 = nodes[j], dx = a.x-b2.x, dy = a.y-b2.y, d = Math.sqrt(dx*dx+dy*dy);
        if(d < 138){
          var o = (1 - d/138) * .34;
          ctx.strokeStyle = (a.hot||b2.hot) ? 'rgba(255,157,66,'+(o*.8)+')' : 'rgba(53,82,255,'+o+')';
          ctx.lineWidth = .8;
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b2.x,b2.y); ctx.stroke();
        }
      }
    }
    nodes.forEach(function(n){
      ctx.fillStyle = n.hot ? 'rgba(255,157,66,0.95)' : 'rgba(140,162,255,0.6)';
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 6.283); ctx.fill();
    });
  }

  function loop(){ frame(); requestAnimationFrame(loop); }
  size();
  if(reduce){ frame(); } else { loop(); }

  var rt;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){ size(); if(reduce) frame(); }, 160);
  });

  /* ═══ MODAL ═══ */
  var modal = document.getElementById('contactModal'),
      form = document.getElementById('contactForm'),
      msg = document.getElementById('formMsg'),
      submitBtn = document.getElementById('cf-submit'),
      lastFocus = null;

  function openModal(){
    lastFocus = document.activeElement;
    modal.classList.add('open');
    modal.setAttribute('aria-hidden','false');
    document.body.classList.add('locked');
    setTimeout(function(){ form.elements.name.focus(); }, 60);
  }
  function closeModal(){
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden','true');
    document.body.classList.remove('locked');
    if(lastFocus) lastFocus.focus();
  }

  document.getElementById('openBtn').addEventListener('click', openModal);
  modal.querySelectorAll('[data-close]').forEach(function(b){
    b.addEventListener('click', closeModal);
  });

  document.addEventListener('keydown', function(e){
    if(!modal.classList.contains('open')) return;
    if(e.key === 'Escape'){ closeModal(); return; }
    if(e.key === 'Tab'){
      var f = modal.querySelectorAll('button, input, select, textarea, a[href]');
      var list = Array.prototype.filter.call(f, function(el){ return el.offsetParent !== null; });
      if(!list.length) return;
      var first = list[0], last = list[list.length-1];
      if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  });

  function say(text, kind){
    msg.textContent = text;
    msg.className = 'form-msg show ' + kind;
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    if(form.elements.site.value) return;

    var name = form.elements.name.value.trim(),
        company = form.elements.company.value.trim(),
        email = form.elements.email.value.trim(),
        topic = form.elements.topic.value,
        message = form.elements.message.value.trim();

    if(!name || !email || !message){
      say('Add your name, email, and a message so we can reply.', 'err');
      return;
    }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
      say('That email address does not look right.', 'err');
      return;
    }

    var subject = 'Website enquiry - ' + topic + (company ? ' - ' + company : '');
    var body = 'Name: ' + name + '\nCompany: ' + (company || '-') +
               '\nEmail: ' + email + '\nInterest: ' + topic + '\n\n' + message;

    if(WEB3FORMS_KEY){
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
      fetch('https://api.web3forms.com/submit', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Accept':'application/json' },
        body: JSON.stringify({ access_key: WEB3FORMS_KEY, from_name: name, replyto: email,
                               name:name, company:company, email:email,
                               topic:topic, message:message, subject:subject })
      }).then(function(r){
        return r.json().catch(function(){ return { success: r.ok }; });
      }).then(function(d){
        if(d && (d.success === true || d.ok === true || d.success === undefined)){
          form.reset();
          say('Message sent. We reply within two business days.', 'ok');
        } else { throw new Error('rejected'); }
      }).catch(function(){
        say('That did not send. Please email us directly at ' + CONTACT_EMAIL + '.', 'err');
      }).then(function(){
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Message';
      });
    } else {
      window.location.href = 'mailto:' + CONTACT_EMAIL +
        '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
      say('Your email app is opening with this message ready to send.', 'ok');
    }
  });
})();
</script>
</body>
</html>
